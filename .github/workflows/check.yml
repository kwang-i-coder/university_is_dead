name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that CLAUDE.md and INSTRUCTIONS.md rules match
        run: |
          diff <(sed -n '/^## 📝/,$p' CLAUDE.md) <(sed -n '/^## 📝/,$p' INSTRUCTIONS.md) \
            || { echo "::error::CLAUDE.md and INSTRUCTIONS.md differ below '## 📝 여기만 고치세요'. Make them identical."; exit 1; }

      - name: Link checker unit tests
        run: python3 -m unittest discover tests -v

      - name: Check example vault links
        run: python3 tools/check_links.py example-vault

      - name: Check that no lecture materials are committed
        run: |
          found=$(git ls-files | grep -Ei '(^|/)강의자료/.*\.(pdf|pptx?|hwp|png|jpe?g)$' || true)
          if [ -n "$found" ]; then echo "::error::Do not commit original lecture materials:"; echo "$found"; exit 1; fi
